<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Patwari Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a2540;
    --paper: #faf5e6;
    --slate: #2b3341;
    --accent: #a04e3a;
    --rule: #d9d2c1;
    --bone: #f4f1ea;
    --text-soft: #5a6478;
    --danger: #b03a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bone);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
  }
  .brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-mark {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }
  .brand-urdu {
    font-family: 'Noto Nastaliq Urdu', serif;
    font-size: 18px;
    color: var(--accent);
    display: block;
    margin-top: 4px;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-top: 8px;
  }
  .divider {
    height: 2px;
    background: var(--accent);
    width: 40px;
    margin: 18px auto;
    border-radius: 2px;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-soft);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: block;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 5px;
    background: #fdfcf7;
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(26,37,64,0.08);
    background: #fff;
  }
  button[type="submit"] {
    margin-top: 6px;
    background: var(--ink);
    color: var(--paper);
    border: 0;
    padding: 11px 16px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s;
  }
  button[type="submit"]:hover { background: var(--slate); }
  .error {
    background: #f8d7da;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 9px 12px;
    border-radius: 5px;
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .foot {
    text-align: center;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand">
      <div class="brand-mark">Patwari Toolkit</div>
      <span class="brand-urdu">پٹواری ٹول کٹ</span>
      <span class="brand-sub">Revenue Document Builder</span>
      <div class="divider"></div>
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" autocomplete="off">
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" autofocus required />
      </div>
      <div>
        <label for="password">PIN</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="foot">
      One account per village.<br>
      Contact your supervisor if you cannot sign in.
    </div>
  </div>
</div>
</body>
</html>
